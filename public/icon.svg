<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Target / Aperture Reticle Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="180 30" stroke-linecap="round" />

  <!-- Crosshair Reticle Notches -->
  <line x1="256" y1="56" x2="256" y2="86" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="426" x2="256" y2="456" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="56" y1="256" x2="86" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="426" y1="256" x2="456" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Semantic Segmentation Mask Arcs (Green & Indigo) -->
  <path d="M 160 256 A 96 96 0 0 1 352 256" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  <path d="M 352 256 A 96 96 0 0 1 160 256" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Inner Camera Sensor Core with Glow -->
  <circle cx="256" cy="256" r="44" fill="url(#coreGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="20" fill="#ffffff" opacity="0.9" />
</svg>
