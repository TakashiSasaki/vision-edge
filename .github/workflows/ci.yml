name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node without dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate npm contract and protected evidence
        run: node scripts/testing/run.mjs preflight
      - name: Repository preflight controls (no dependencies)
        run: node scripts/testing/run.mjs preflight-tests
      - name: Set up npm dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm run --silent ci:install
      - name: Typecheck
        run: node scripts/testing/run.mjs typecheck
      - name: ESLint
        run: node scripts/testing/run.mjs lint
      - name: Unit and component tests
        run: npm run --silent test
      - name: Real-SDK foundation regressions (offline)
        run: npm run --silent test:foundation
      - name: Test output protocol regressions
        run: npm run --silent test:output
      - name: Explicit SDK delegate controls (model-free)
        run: npm run --silent test:real-sdk:delegate
      - name: Production build
        run: node scripts/testing/run.mjs build
      - name: Install Chromium
        run: npm run --silent ci:browser
      - name: Browser smoke tests
        run: npm run --silent test:e2e
      - name: Stylesheet smoke controls
        run: npm run --silent test:e2e:controls
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .cache/test-runs/
          include-hidden-files: true
          retention-days: 14

  preflight-missing-lock:
    name: Preflight missing-lock negative control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Remove canonical lock only in this isolated negative checkout
        run: rm -- package-lock.json
      - name: Set up Node with dependency cache disabled
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require intended missing-lock guard failure
        run: node scripts/testing/missing-lock-control.mjs
      - name: Upload preflight negative-control evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-missing-lock
          path: .cache/preflight-negative/
          include-hidden-files: true
          retention-days: 14
