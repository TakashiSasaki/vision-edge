name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirage-research-controls:
    name: Mirage research controls (synthetic, no model downloads)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pinned Node before research dependency installation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate repository contract before research dependency installation
        run: |
          node scripts/testing/run.mjs preflight
          node scripts/testing/run.mjs preflight-tests
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated pinned numerical tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/test-runs/mirage-research-controls
          python -m venv .cache/mirage-ci-python
          .cache/mirage-ci-python/bin/python -m pip install -r scripts/mirage/requirements-hconvglu.txt 2>&1 | tee .cache/test-runs/mirage-research-controls/install.log
      - name: Run operator and encoder controls without checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/test-runs/mirage-research-controls
          .cache/mirage-ci-python/bin/python -m unittest discover -s scripts/mirage -p 'test_hconvglu.py' -v 2>&1 | tee .cache/test-runs/mirage-research-controls/hconvglu.log
          .cache/mirage-ci-python/bin/python -m unittest discover -s scripts/mirage -p 'test_encoder_candidate.py' -v 2>&1 | tee .cache/test-runs/mirage-research-controls/encoder.log
          .cache/mirage-ci-python/bin/python -m unittest discover -s scripts/mirage -p 'test_refinement.py' -v 2>&1 | tee .cache/test-runs/mirage-research-controls/refinement.log
          .cache/mirage-ci-python/bin/python -m unittest discover -s scripts/mirage -p 'test_reference_diagnosis.py' -v 2>&1 | tee .cache/test-runs/mirage-research-controls/reference-diagnosis.log
          .cache/mirage-ci-python/bin/python -m unittest discover -s scripts/mirage -p 'test_numerical_effects.py' -v 2>&1 | tee .cache/test-runs/mirage-research-controls/numerical-effects.log
      - name: Upload raw research control logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirage-research-controls
          path: .cache/test-runs/
          include-hidden-files: true
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node without dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate npm contract and protected evidence
        run: node scripts/testing/run.mjs preflight
      - name: Repository preflight controls (no dependencies)
        run: node scripts/testing/run.mjs preflight-tests
      - name: Check Mirage checkpoint tooling (synthetic, no model downloads)
        run: |
          python3 -m unittest discover -s scripts/mirage -p 'test_verify_checkpoint.py' -v
          python3 -m unittest discover -s scripts/mirage -p 'test_acquire_reference.py' -v
      - name: Set up npm dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm run --silent ci:install
      - name: Typecheck
        run: node scripts/testing/run.mjs typecheck
      - name: ESLint
        run: node scripts/testing/run.mjs lint
      - name: Unit and component tests
        run: npm run --silent test
      - name: Real-SDK foundation regressions (offline)
        run: npm run --silent test:foundation
      - name: Test output protocol regressions
        run: npm run --silent test:output
      - name: Explicit SDK delegate controls (model-free)
        run: npm run --silent test:real-sdk:delegate
      - name: Production build
        run: node scripts/testing/run.mjs build
      - name: Install Chromium
        run: npm run --silent ci:browser
      - name: Browser smoke tests
        run: npm run --silent test:e2e
      - name: Stylesheet smoke controls
        run: npm run --silent test:e2e:controls
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .cache/test-runs/
          include-hidden-files: true
          retention-days: 14

  preflight-missing-lock:
    name: Preflight missing-lock negative control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Remove canonical lock only in this isolated negative checkout
        run: rm -- package-lock.json
      - name: Set up Node with dependency cache disabled
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require intended missing-lock guard failure
        run: node scripts/testing/missing-lock-control.mjs
      - name: Upload preflight negative-control evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-missing-lock
          path: .cache/preflight-negative/
          include-hidden-files: true
          retention-days: 14
